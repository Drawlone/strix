name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # - os: macos-latest
          #   target: macos-arm64
          # - os: macos-15-intel
          #   target: macos-x86_64
          - os: ubuntu-latest
            target: linux-x86_64
            # 使用基于 AlmaLinux 8 (glibc 2.28) 的 manylinux 镜像以确保兼容性
            container: "quay.io/pypa/manylinux_2_28_x86_64"
          # - os: windows-latest
          #   target: windows-x86_64

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          yum install -y git wget tar gzip

      - name: Set up Python 3.13 (Non-Linux)
        if: matrix.target != 'linux-x86_64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Python 3.13 (Linux Container)
        if: matrix.target == 'linux-x86_64'
        run: |
          # Use pre-installed Python 3.13 in manylinux image which is compatible with glibc 2.28
          ln -sf /opt/python/cp313-cp313/bin/python3.13 /usr/local/bin/python3
          ln -sf /opt/python/cp313-cp313/bin/python3.13 /usr/local/bin/python
          python3 --version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Build
        shell: bash
        run: |
          # 针对 Linux 容器环境的特殊设置
          if [[ "${{ matrix.target }}" == "linux-x86_64" ]]; then
            export PATH="$HOME/.local/bin:$PATH"
            poetry env use python3.13
          fi

          poetry install --with dev
          poetry run pyinstaller strix.spec --noconfirm

          VERSION=$(poetry version -s)
          mkdir -p dist/release

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/strix.exe "dist/release/strix-${VERSION}-${{ matrix.target }}.exe"
            (cd dist/release && 7z a "strix-${VERSION}-${{ matrix.target }}.zip" "strix-${VERSION}-${{ matrix.target }}.exe")
          else
            cp dist/strix "dist/release/strix-${VERSION}-${{ matrix.target }}"
            chmod +x "dist/release/strix-${VERSION}-${{ matrix.target }}"
            tar -C dist/release -czvf "dist/release/strix-${VERSION}-${{ matrix.target }}.tar.gz" "strix-${VERSION}-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: strix-${{ matrix.target }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: release/*
